assessment:
  reproduction_status: fully_reproduced
  summary_plain: >-
    QAC built the paper's whole modular exponentiation as one Q# circuit, checked it against the
    paper's reference implementation, and counted it on the real RSA-2048 instance with every real
    lookup table: {{ reproductions.0.figures.logical_qubits.value | n }} logical qubits and
    {{ reproductions.0.figures.toffoli_count.value | sci }} expected Toffolis, against the paper's
    {{ reported.figures.logical_qubits.value | n }} and {{ reported.figures.toffoli_count.value | sci }}.
    The paper's own layout model, rebuilt and applied to those counts, gives
    {{ reproductions.0.figures.physical_qubits.value | n }} physical qubits and
    {{ reproductions.0.figures.runtime_seconds.value | hours }}, within its bounds.
  what_this_shows:
    - The algorithm of Appendix A.1, built as one circuit, computes exactly what the paper's reference implementation computes on every small instance checked, including the phases of a superposed input.
    - On the real RSA-2048 instance, with a real residue system and all of its lookup tables, the circuit needs the Toffoli count of Table 5, and the failed-shot rate recomputed for that residue system equals Table 5's.
    - Table 5's qubit count is the long-lived registers; the built circuit's peak, with temporary qubits, is a few percent higher.
    - The paper's layout and timing model, rebuilt as code and applied to the circuit's own counts, stays under one million qubits and one week; the qubit count uses part of the slack the paper adds.
    - The paper's 12.07 hours per shot is more than its own durations give for the Table 5 operation counts, so the runtime claim has extra margin.
  what_this_does_not_show:
    - The physical model takes its component figures from the work the paper cites (yoked cold storage, magic state cultivation, the CCZ factory); they are not re-simulated here.
    - The QDK estimator shows that without yoked storage the same counts need several million qubits, so the claim depends on yoked storage performing as projected under the algorithm's workload, which Sec. 3.2 leaves to future work.
    - The failed-shot rate keeps the paper's assumption that masking a fraction S of the output costs a fraction S of shots (Assumption 2); the approximation's own error is measured, the masked period finding is not simulated at full size.
  findings:
    - aspect: logical_qubits
      verdict: within_factor
      note: The built circuit's peak, which includes temporary qubits; Table 5 counts only the long-lived registers.
    - aspect: toffoli_count
      verdict: matches
      note: Counted from the whole circuit on the real instance with the real tables; within a fraction of a percent of Table 5.
    - aspect: physical_qubits
      verdict: matches
      note: The paper's layout model applied to the circuit's counts, below the stated bound; above the paper's 897,864 because the circuit's peak holds more hot qubits.
    - aspect: runtime_seconds
      verdict: matches
      note: The paper's durations applied to the circuit's operation counts, below the stated bound and below the paper's own 4.96 days.
    - aspect: code_distance
      verdict: matches
      note: The smallest distance meeting the paper's per-round target under its Fig. 6 fit.
  classical_status: not_solved_classically_at_target_accuracy
  classical_status_note: No 2048-bit RSA integer has been publicly factored by classical means.

