title: FeMoCo 76-orbital (Li) ground-state energy resource estimate via spectral amplification and DFTHC (Low et al., 2025)
short_title: FeMoCo 76-orbital resource estimate (Low et al. 2025)
headline: The ground-state energy of FeMoCo's larger 76-orbital (Li) active space could be estimated with about 4.5 million physical qubits in roughly 8.6 hours.
claim_type: literature_resource_estimate
domain: quantum_chemistry
taxonomy: application

