assessment:
  reproduction_status: partially_reproduced
  summary_plain: >-
    QAC rebuilt the estimate from the paper's own FeMoCo integrals and cost formula. The
    logical qubit count agrees: {{ reproductions.0.figures.logical_qubits.value | n }} against
    {{ reported.figures.logical_qubits.value | n }}. The T count does not: we obtain
    {{ reproductions.0.figures.t_count.value | sci }} against the paper's
    {{ reported.figures.t_count.value | sci }}, a factor of
    {{ comparisons[aspect=t_count].ratio | x }}. With a lattice-surgery surface-code model in
    place of the paper's, the machine needs
    {{ reproductions.0.figures.physical_qubits.value | million }} physical qubits but
    about {{ reproductions.0.results.diagnostics.runtime_years_error_rate_1e_3 | n }} years.
  what_this_shows:
    - The paper's logical qubit count follows from its stated ingredients, to within one qubit.
    - The Jordan–Wigner Hamiltonian built from the paper's integrals has about twice as many Pauli terms as the term count the paper's cost formula uses.
    - The paper's cost formula, evaluated with the paper's own constants and term count, gives several times more T gates than the paper's tables report.
    - The physical cost depends strongly on how fast logical T gates can be applied; a lattice-surgery model gives a much smaller but much slower machine than the paper's.
  what_this_does_not_show:
    - It does not establish which of the paper's figures or inputs is the source of the T-count difference; the paper's circuits and scripts are not public.
    - The Trotter number, which sets the number of Trotter steps, is taken from the paper and was not rebuilt.
    - The full 54-orbital circuit was not compiled; its rotation count comes from a term count and a per-step rule checked on smaller active spaces.
    - The paper's surface-code model was not rebuilt, so the physical comparison is not like-for-like.
    - Preparing the trial state is not costed, as in the paper.
  findings:
    - aspect: logical_qubits
      verdict: within_factor
      note: Spin orbitals, one phase-estimation qubit, and the one synthesis ancilla the paper mentions; the paper lists one more qubit without a breakdown.
    - aspect: t_count
      verdict: differs
      note: About twice the rotations per Trotter step, and the paper's formula does not return its tabulated count even with its own inputs.
    - aspect: physical_qubits
      verdict: differs
      note: Computed with a lattice-surgery model that applies T gates far more slowly, so far fewer T factories are needed.
    - aspect: runtime_seconds
      verdict: differs
      note: Computed with a logical cycle per T gate where the paper assumes one T gate per physical gate time, on top of the larger T count.
    - aspect: code_distance
      verdict: within_factor
      note: Selected by the resource estimator for a longer computation than the paper's.
  classical_status: unknown
  classical_status_note: Not assessed in this reproduction. The record for the same active space, femoco-low-2025, lists not_solved_classically_at_target_accuracy with a review pending.

