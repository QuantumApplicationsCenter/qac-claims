id: femoco-low-2025
title: FeMoCo ground-state energy resource estimate via spectral amplification and DFTHC (Low et al., 2025)
short_title: FeMoCo resource estimate (Low et al. 2025)
headline: FeMoCo's ground-state energy could be estimated with about 3.2 million physical qubits in roughly 2.7 hours.
claim_type: literature_resource_estimate
domain: quantum_chemistry
taxonomy: application

source:
  type: journal_article
  title: Fast Quantum Simulation of Electronic Structure by Spectral Amplification
  authors:
    - Guang Hao Low
    - Robbie King
    - Dominic W. Berry
    - Qiushi Han
    - A. Eugene DePrince III
    - Alec F. White
    - Ryan Babbush
    - Rolando D. Somma
    - Nicholas C. Rubin
  author_list_complete: true
