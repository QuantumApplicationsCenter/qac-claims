assertion:
  what_is_claimed: >-
    Estimating the ground-state energy of the FeMoCo 76-orbital, 113-electron (Li et al.)
    active space to 1 mHa precision needs about 9.99e8 Toffoli gates and 1,459 logical qubits
    using double-factorized tensor hypercontraction with BLISS and sum-of-squares spectrum
    amplification; under the paper's error-correction model (four CCZ factories, physical
    error rate 1e-3, 1 µs surface-code cycle, 10 µs reaction time, distance-27 patches)
    this costs about 4.5 million physical qubits and 8.6 hours.
  workload:
    system: FeMoCo (Li 76-orbital active space)
    active_space_orbitals: 76
    active_space_electrons: 113
    target_observable: ground_state_energy
    target_precision: { value: 1.0e-3, unit: hartree, locator: Table V }
  method: Sum-of-squares spectrum amplification (SOSSA) over a double-factorized tensor-hypercontraction (DFTHC) Hamiltonian with BLISS; qubitized phase estimation
  architecture_assumed: Surface code with four CCZ factories, following the error-correction model of Lee et al. (2021), the paper's Ref. 7

