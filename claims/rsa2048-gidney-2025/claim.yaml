id: rsa2048-gidney-2025
title: RSA-2048 factoring resource estimate with approximate residue arithmetic, yoked storage, and magic state cultivation (Gidney, 2025)
short_title: RSA-2048 resource estimate (Gidney 2025)
headline: A 2048-bit RSA integer could be factored in less than a week with less than a million noisy qubits.
claim_type: literature_resource_estimate
domain: cryptanalysis
taxonomy: application

source:
  type: preprint
  title: How to factor 2048 bit RSA integers with less than a million noisy qubits
  authors:
    - Craig Gidney
  author_list_complete: true
  year: 2025
  arxiv: "2505.15917"
  doi: 10.48550/arXiv.2505.15917

assertion:
  what_is_claimed: >-
    Factoring a 2048-bit RSA integer with Ekerå–Håstad period finding over approximate residue
    arithmetic needs about 6.5e9 expected Toffoli gates and 1,399 logical qubits; on a square grid
    of qubits with nearest-neighbor connections, a 0.1% gate error rate, a 1 µs surface-code
    cycle, and a 10 µs reaction time, with idle qubits held in yoked surface codes and Toffoli
    states made by magic state cultivation, this takes less than a million noisy qubits and less
    than a week.
  workload:
    system: RSA-2048 modulus (n = 2048 bits), Ekerå–Håstad parameter s = 8
    target_observable: factors of a 2048-bit RSA integer
    target_precision:
      value: 1.0e-15
      unit: dimensionless
      locator: "Sec. 3.2, p. 18"
      note: >-
        Factoring has no numerical precision target. This is the paper's target logical error
        rate per logical qubit round, chosen so a 12-hour shot has a 93.3% chance of no logical error.
  method: >-
    Ekerå–Håstad period finding with approximate residue (RNS) arithmetic after
    Chevignard–Fouque–Schrottenloher (2024), costed as additions, table lookups, and phaseups
    counted from a reference implementation (Tables 3 and 4)
  architecture_assumed: >-
    Surface code at distance 25 for compute and hot storage, surface codes yoked by 2D parity
    checks for cold storage, and six factories doing magic state cultivation followed by
    8T-to-CCZ distillation

