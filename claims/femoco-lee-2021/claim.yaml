assertion:
  what_is_claimed: Lee et al. report 2,142 logical qubits and approximately 5.3 billion Toffoli gates for the Reiher
    FeMoCo model at THC rank 350. A separate space-optimized surface-code implementation uses approximately 6.7
    billion Toffolis, about four million physical qubits, and about three days; the abstract gives under four days.
    The Li model is a distinct logical comparison.
