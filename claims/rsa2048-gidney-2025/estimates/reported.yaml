schema_version: "1.0"
kind: reported
claim_id: rsa2048-gidney-2025
figures:
  logical_qubits:
    value: 1399
    unit: count
    locator: "Table 5, n = 2048 row, p. 17"
    note: >-
      Counts the long-lived registers only: the paper's published estimator computes it as
      m + (ℓ + len m) + ℓ + f + max(ℓ, f, ℓ + len m). Table 4 also counts the temporary qubits of
      additions and lookups, so its peak is higher. Sec. 3.2 (p. 18) says the maximum is 1409,
      reached during loop4 when m + 3f + 2ℓ + len m qubits are active; with the stated parameters
      that expression gives 1432, and the loop1 row of Table 4 gives 1409.
  toffoli_count:
    value: 6500000000
    unit: count
    locator: "Table 5, n = 2048 row, p. 17"
    qualifier: rounded
    note: >-
      Stated as 6.5e+09. Expected Toffolis per factoring, not per shot. The paper's published
      estimator multiplies the per-shot count by (s + 1)/(1 − Pdeviant), about 9.11 shots; the
      Table 5 caption defines E(shots) = 9.2, which also includes a /0.99 for postprocessing.
  physical_qubits:
    value: 1000000
    unit: count
    locator: "Abstract, p. 1; Sec. 3.2, p. 20"
    qualifier: upper_bound
    note: >-
      Stated as "less than a million noisy qubits". Sec. 3.2 (p. 20) totals the layout at
      897,864 physical qubits and reports one million to leave slack for cold-storage streaming.
  runtime_seconds:
    value: 604800
    unit: seconds
    locator: "Abstract, p. 1; Sec. 3.2, p. 20"
    qualifier: upper_bound
    note: >-
      Stated as "less than a week". Sec. 3.2 (p. 20) derives 12.07 hours per shot, an expected
      4.63 days (the text multiplies by 9.1 shots), and 4.96 days after dividing by the 93.3% chance of a shot having
      no logical error, which it rounds up to a week.
  code_distance:
    value: 25
    unit: count
    locator: "Sec. 3.2, p. 18"
    note: Distance of the hot-storage and compute surface-code patches.
notes:
  - "Transcribed from Gidney, How to factor 2048 bit RSA integers with less than a million noisy qubits, arXiv:2505.15917v1 (2025). Page numbers follow the arXiv PDF."
  - "The issue asks for the physical-qubit and runtime figures to be recorded as the upper bounds the abstract states; the derived values (897,864 qubits, 4.96 days) are kept in the notes above."
