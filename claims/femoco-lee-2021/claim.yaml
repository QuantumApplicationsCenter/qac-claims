assessment:
  reproduction_status: partially_reproduced
  summary_plain: 'OpenFermion reproduces the analytic logical counts. A separate half-angle stage schedule, the
    cited CCZ-factory formulas and a custom QDK ISA reconstruct the published physical resource model: {{ reproductions[id=openfermion-thc-layout-2026-11].figures.physical_qubits.value
    | million }} physical qubits and {{ reproductions[id=openfermion-thc-layout-2026-11].figures.runtime_seconds.value
    | hours }}. This is conditional on the paper''s floorplan, code distances and phenomenological error model;
    it is not a gate-by-gate simulation or independent layout optimization.'
  what_this_shows:
  - The published THC inputs reproduce the analytic logical counts closely in OpenFermion.
  - The half-angle-loading subroutine schedule independently generates the layout operation count and live-qubit
    profile from the algorithm inputs.
  - The published floorplan and cited factory/reliability model, evaluated through a custom QDK resource ISA, agree
    closely with the rounded primary hardware claims.
  what_this_does_not_show:
  - No chemical energy, tensor approximation accuracy, initial-state overlap, or quantum advantage is independently
    established.
  - The floorplan and code distances are accepted from the paper; routability, optimality and protection distances
    are not independently derived.
  - The custom QDK ISA costs subroutine macros; it is not QDK Chemistry compiling a full gate-level THC circuit.
  - Factory warmup, initial-state preparation, finite-batch scheduling and a routed Clifford trace are not independently
    modeled.
  findings:
  - aspect: logical_qubits
    verdict: matches
    note: Analytic total includes the system register; Reiher and the separately labeled Li cases match their table
      rows.
  - aspect: toffoli_count
    verdict: within_factor
    note: Analytic count agrees closely with the rounded Table IV figure; layout count is kept separate.
  - aspect: physical_qubits
    verdict: within_factor
    note: Main CCZ-layout resource model uses the published footprint and cited factory dimensions; it agrees closely
      with the rounded physical count, conditional on that geometry.
  - aspect: runtime_seconds
    verdict: within_factor
    note: Half-angle stage schedule and the independently calculated factory tick give a runtime close to the primary
      three-day claim; later three-and-a-half-day wording is retained as ambiguous.
  - aspect: code_distance
    verdict: not_compared
    note: Data code distance is imposed from the paper, not independently selected.
  classical_status: unknown
  classical_status_note: Current classical solvability at the stated accuracy has not been assessed in this reproduction.
