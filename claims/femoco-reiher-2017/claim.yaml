schema_version: "1.0"
id: femoco-reiher-2017
title: FeMoCo ground-state energy resource estimate via Trotter-based phase estimation (Reiher et al., 2017)
short_title: FeMoCo resource estimate (Reiher et al. 2017)
headline: FeMoCo's ground-state energy could be computed to 0.1 mHa in about 130 days with 111 logical qubits and 1.1 × 10¹⁵ T gates, or about 180 million physical qubits at a 10⁻³ error rate.
claim_type: literature_resource_estimate
domain: quantum_chemistry
taxonomy: application

source:
  type: journal_article
  title: Elucidating reaction mechanisms on quantum computers
  authors:
    - Markus Reiher
    - Nathan Wiebe
    - Krysta M. Svore
    - Dave Wecker
    - Matthias Troyer
  author_list_complete: true
  year: 2017
  venue:
    name: Proceedings of the National Academy of Sciences
    volume: "114"
    pages: 7555-7560
  doi: 10.1073/pnas.1619152114
  arxiv: "1605.03590"

assertion:
  what_is_claimed: >-
    Computing the ground-state energy of FeMoCo structure 1 (54 electrons in 54 spatial
    orbitals, spin 0, charge +3) to 0.1 mHa by phase estimation on a second-order
    Trotter–Suzuki step, with rotations executed serially, needs about 1.1e15 T gates and
    111 logical qubits, and takes about 130 days at one logical T gate per 10 ns (Table 1).
    With the surface code and physical gates at 100 MHz, the same computation needs about
    1.8e8 physical qubits at a physical error rate of 1e-3 and about 1.2e6 at 1e-6 (Table 2).
  workload:
    system: FeMoCo, structure 1 (spin 0, charge +3)
    active_space_orbitals: 54
    active_space_electrons: 54
    target_observable: ground_state_energy
    target_precision: { value: 1.0e-4, unit: hartree, locator: Table 1 }
  method: Second-order Trotter–Suzuki product formula in the Jordan–Wigner representation, with phase estimation, serial term ordering, and repeat-until-success synthesis of rotations into Clifford and T gates
  architecture_assumed: Surface code with 15-to-1 magic-state distillation in dedicated T factories, physical gates at 100 MHz, and one logical T gate every 10 ns

