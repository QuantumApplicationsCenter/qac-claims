assessment:
  reproduction_status: partially_reproduced
  summary_plain: >-
    QAC rebuilt the circuit from the paper's published hyper-parameters and obtained
    {{ reproductions.0.figures.logical_qubits.value | n }} logical qubits and
    {{ reproductions.0.figures.toffoli_count.value | sci }} Toffoli gates, against the paper's
    {{ reported.figures.logical_qubits.value | n }} and {{ reported.figures.toffoli_count.value | sci }}.
    With a different factory design and timing model, the physical estimate is
    {{ reproductions.0.figures.physical_qubits.value | million }} qubits and
    {{ reproductions.0.figures.runtime_seconds.value | hours }}.
  what_this_shows:
    - The paper's logical resource counts for the 76-orbital active space (qubits and Toffoli gates) are reproduced to within about 10% by an independent implementation of the same algorithmic ingredients.
    - The 54-orbital reproduction carries over to the larger active space by changing only its inputs, apart from a wider rotation-synthesis search range needed to meet the error budget.
    - Physical costs for the same logical circuit change by several times when the factory design, rotation synthesis, and timing model change, even with identical error rate, cycle time, and code distance.
  what_this_does_not_show:
    - The Hamiltonian tensors are synthetic (random values of the paper's stated dimensions); the reproduction validates circuit structure and counts, not FeMoCo's chemistry or energies.
    - The paper's CCZ-factory architecture and 10 µs reaction time were not modeled, so the physical comparison is not like-for-like.
    - The rotation-synthesis cost is not the estimator's default. To keep the total failure probability within 1%, it was allowed up to 40 T states per rotation instead of its default maximum of 20.
    - The surface-code distance of 27 was imposed as an input, not selected independently.
  findings:
    - aspect: logical_qubits
      verdict: within_factor
      note: Same algorithm and hyper-parameters; small differences in circuit construction.
    - aspect: toffoli_count
      verdict: within_factor
      note: Same algorithm and hyper-parameters; small differences in circuit construction.
    - aspect: physical_qubits
      verdict: within_factor
      note: Computed with different magic-state factories and a wider rotation-synthesis search range.
    - aspect: runtime_seconds
      verdict: differs
      note: Computed without a separate reaction time and with different factories.
    - aspect: code_distance
      verdict: not_compared
      note: Set to the paper's value as an input.
  classical_status: not_solved_classically_at_target_accuracy
  classical_status_note: Carried over from the 54-orbital record; QAC has not independently assessed classical methods for the 76-orbital active space.

