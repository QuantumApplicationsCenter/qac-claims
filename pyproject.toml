[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qacclaims"
version = "0.1.0"
description = "Validation, build, and reproduction tooling for the QAC claims registry."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["jsonschema>=4.18", "PyYAML>=6.0"]

[project.optional-dependencies]
execute = ["nbconvert>=7", "nbclient>=0.10", "ipykernel>=6", "jupyter-core>=5"]
test = ["pytest>=8"]

[project.scripts]
qacclaims = "qacclaims.cli:main"

[tool.setuptools.packages.find]
include = ["qacclaims*"]
