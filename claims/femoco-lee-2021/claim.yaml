    system: FeMoCo (Reiher active space; Li logical variants recorded separately)
    active_space_orbitals: 54
    active_space_electrons: 54
    target_observable: ground_state_energy
    target_precision:
      value: 0.0016
      unit: hartree
      locator: Eq. (25) discussion, p. 14
      note: Total energy tolerance; phase-estimation allocation is 0.001 Ha.
  method: Non-orthogonal tensor hypercontraction, qubitization and quantum phase estimation
  architecture_assumed: Surface-code layout with four CCZ factories and AutoCCZ fixup areas; physical gate error
    rate 0.1%, cycle 1 microsecond, reaction time 10 microseconds
